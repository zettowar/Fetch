# Production orchestration. Unlike docker-compose.yml (local dev), this builds
# immutable images (no source bind-mounts), runs non-root with no autoreload,
# adds healthchecks + resource limits, and sets ENVIRONMENT=production.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Supply real secrets via .env (JWT_SECRET, DATABASE_URL, SENTRY_DSN, etc.).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fetch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fetch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fetch}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
      # Trust the forwarded chain only from inside the Docker bridge network,
      # never "*". 172.16.0.0/12 is Docker's default private range and covers
      # whatever 172.x subnet Compose assigns fetch_default, so uvicorn honors
      # nginx's X-Forwarded-For but nothing external. Caddy overwrites the
      # header at the edge and nginx forwards it verbatim, so the value keyed
      # for rate limiting and audit IPs is the real client, not a spoofable one.
      # (If the host uses a custom Docker address pool outside 172.16/12, widen
      # this to match, or rate limiting will bucket all traffic as the proxy IP.)
      FORWARDED_ALLOW_IPS: "172.16.0.0/12"
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
      # With 4 uvicorn workers each process keeps its own counters, so a scrape
      # saw whichever worker answered. This makes them write to shared mmap
      # files that /metrics aggregates. tmpfs: the data is per-container-run and
      # must not survive a restart, or stale PID files inflate the totals.
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus
    tmpfs:
      - /run/prometheus
    env_file:
      - .env
    # Migrations run here (and only here) before the server starts, so a fresh
    # deploy boots with its schema in place.
    command: >
      sh -c "rm -rf /run/prometheus/* &&
             alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
      # Every bulk email is sent from here, so these counters have to be
      # scrapeable or the email alerts can never fire. Its own directory, not
      # the backend's: PIDs are per-container and would collide in a shared one.
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus
    tmpfs:
      - /run/prometheus
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "rm -rf /run/prometheus/* &&
             exec celery -A app.worker worker --loglevel=info --concurrency=2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Sequenced after the backend's healthcheck so migrations have run.
      backend:
        condition: service_healthy
    healthcheck:
      # Must run in a shell: exec-form CMD does not expand $HOSTNAME, so the
      # old check pinged a literal node "celery@$HOSTNAME" that never exists
      # and was therefore always unhealthy. $(hostname) resolves to this
      # worker's real node name (celery defaults to celery@<hostname>).
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    command: celery -A app.worker beat --loglevel=info
    volumes:
      - ./deploy/beat_healthcheck.py:/app/beat_healthcheck.py:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Not "is the process up" — docker already restarts on exit. This checks
      # that beat is still *scheduling*: the DatabaseScheduler stamps
      # periodic_tasks.last_run_at on every fire, so a stale maximum means a
      # wedged scheduler, which otherwise silently stops the weekly crown, the
      # digest and token cleanup with no restart and nothing in the logs.
      test: ["CMD-SHELL", "python /app/beat_healthcheck.py || exit 1"]
      interval: 5m
      timeout: 20s
      retries: 3
      # Generous: beat's shortest job runs every 10 minutes, so a fresh
      # container has legitimately not stamped anything for a while.
      start_period: 15m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ENABLE_IP_GEOLOCATION: ${VITE_ENABLE_IP_GEOLOCATION:-true}
        VITE_SHOPIFY_DOMAIN: ${VITE_SHOPIFY_DOMAIN:-}
        VITE_SHOPIFY_STOREFRONT_TOKEN: ${VITE_SHOPIFY_STOREFRONT_TOKEN:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://${DOMAIN:-}}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
    # Not published — caddy is the only public entry point, so nothing is
    # reachable over cleartext HTTP.
    depends_on:
      - backend
    # Lets `up --wait` gate on the web tier actually serving, not just starting.
    # busybox wget ships in the nginx-unprivileged alpine image. Use 127.0.0.1,
    # not localhost: localhost can resolve to IPv6 ::1, but nginx only listens
    # on IPv4 (`listen 8080;`), so a localhost probe gets "connection refused".
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # TLS terminator: auto-provisioned Let's Encrypt certs for $DOMAIN, with
  # HTTP->HTTPS redirect and HSTS (deploy/Caddyfile). DOMAIN=localhost gives
  # a self-signed cert for smoke tests without DNS.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (your site hostname)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # Daily pg_dump + uploads tarball with rotation into the db_backups volume
  # (deploy/backup.sh). Photos are on disk, not in Postgres, so both are needed
  # for a restore to actually restore anything users can see.
  # Off-box copies are still on you — sync the volume to DO Spaces or similar.
  db-backup:
    image: postgres:15
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-fetch}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-fetch}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - db_backups:/backups
      # Read-only: this sidecar archives user photos, it must never mutate them.
      - uploads:/uploads:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Monitoring ────────────────────────────────────────────────────────────
  # Opt-in: `docker compose --profile monitoring up -d` (make deploy includes
  # it unless MONITORING=0). Costs ~200 MB of RAM, which is worth naming on a
  # small droplet. Neither service is published — Prometheus scrapes the
  # backend over the internal network, and /metrics is not proxied by nginx,
  # so none of this is reachable from the internet.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days is plenty to answer "when did this start?" without the TSDB
      # quietly eating the droplet's disk.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    # The bearer token reaches the container as a file because Alertmanager's
    # http_config reads credentials from disk, not from the environment.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${ALERT_WEBHOOK_TOKEN}" ]; then
          echo "ALERT_WEBHOOK_TOKEN is not set — required to run the monitoring profile." >&2
          exit 1
        fi
        printf '%s' "$${ALERT_WEBHOOK_TOKEN}" > /etc/alertmanager/webhook_token
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    environment:
      # Plain default, NOT `:?` — compose interpolates every service's
      # variables even when its profile is disabled, so a required-variable
      # marker here would break `make deploy` for anyone not running
      # monitoring. The entrypoint above enforces it instead, where it only
      # applies to people who actually started this container.
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
  db_backups:
  prometheus_data:
  alertmanager_data:
