# Production orchestration. Unlike docker-compose.yml (local dev), this builds
# immutable images (no source bind-mounts), runs non-root with no autoreload,
# adds healthchecks + resource limits, and sets ENVIRONMENT=production.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Supply real secrets via .env (JWT_SECRET, DATABASE_URL, SENTRY_DSN, etc.).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fetch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fetch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fetch}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
      # nginx (the only route to this container) sets X-Forwarded-For; trust it
      # so rate limiting keys on real client IPs, not the proxy's.
      FORWARDED_ALLOW_IPS: "*"
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
    env_file:
      - .env
    # Migrations run here (and only here) before the server starts, so a fresh
    # deploy boots with its schema in place.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Sequenced after the backend's healthcheck so migrations have run.
      backend:
        condition: service_healthy
    healthcheck:
      # Must run in a shell: exec-form CMD does not expand $HOSTNAME, so the
      # old check pinged a literal node "celery@$HOSTNAME" that never exists
      # and was therefore always unhealthy. $(hostname) resolves to this
      # worker's real node name (celery defaults to celery@<hostname>).
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ENABLE_IP_GEOLOCATION: ${VITE_ENABLE_IP_GEOLOCATION:-true}
        VITE_SHOPIFY_DOMAIN: ${VITE_SHOPIFY_DOMAIN:-}
        VITE_SHOPIFY_STOREFRONT_TOKEN: ${VITE_SHOPIFY_STOREFRONT_TOKEN:-}
    # Not published — caddy is the only public entry point, so nothing is
    # reachable over cleartext HTTP.
    depends_on:
      - backend
    # Lets `up --wait` gate on the web tier actually serving, not just starting.
    # busybox wget ships in the nginx-unprivileged alpine image. Use 127.0.0.1,
    # not localhost: localhost can resolve to IPv6 ::1, but nginx only listens
    # on IPv4 (`listen 8080;`), so a localhost probe gets "connection refused".
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # TLS terminator: auto-provisioned Let's Encrypt certs for $DOMAIN, with
  # HTTP->HTTPS redirect and HSTS (deploy/Caddyfile). DOMAIN=localhost gives
  # a self-signed cert for smoke tests without DNS.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (your site hostname)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # Daily pg_dump with rotation into the db_backups volume (deploy/backup.sh).
  # Off-box copies are still on you — sync the volume to DO Spaces or similar.
  db-backup:
    image: postgres:15
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-fetch}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-fetch}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
  db_backups:
