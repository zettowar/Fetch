# Production orchestration. Unlike docker-compose.yml (local dev), this builds
# immutable images (no source bind-mounts), runs non-root with no autoreload,
# adds healthchecks + resource limits, and sets ENVIRONMENT=production.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Supply real secrets via .env (JWT_SECRET, DATABASE_URL, SENTRY_DSN, etc.).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fetch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fetch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fetch}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
      # nginx (the only route to this container) sets X-Forwarded-For; trust it
      # so rate limiting keys on real client IPs, not the proxy's.
      FORWARDED_ALLOW_IPS: "*"
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
    env_file:
      - .env
    # Migrations run here (and only here) before the server starts, so a fresh
    # deploy boots with its schema in place.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Sequenced after the backend's healthcheck so migrations have run.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
    env_file:
      - .env
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ENABLE_IP_GEOLOCATION: ${VITE_ENABLE_IP_GEOLOCATION:-true}
        VITE_SHOPIFY_DOMAIN: ${VITE_SHOPIFY_DOMAIN:-}
        VITE_SHOPIFY_STOREFRONT_TOKEN: ${VITE_SHOPIFY_STOREFRONT_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  redisdata:
  uploads:
