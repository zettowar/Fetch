server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API and uploaded photos are served by the backend container, which
    # publishes no host port — this proxy is the only route to it.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Forward Caddy's already-sanitized X-Forwarded-For verbatim rather than
        # appending ($proxy_add_x_forwarded_for) — the edge set it to the real
        # client IP, so this stays a single trustworthy value to the backend.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Photo uploads are capped at 10MB by the backend; leave headroom.
        client_max_body_size 12m;
    }

    # Server-rendered public share pages, sitemap and robots.txt come from the
    # backend — the SPA can't emit the per-page Open Graph tags social scrapers
    # read. These take precedence over the SPA fallback below.
    location /lost/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell so deploys go live immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths resolve to index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
