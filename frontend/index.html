<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ee7a10" />
    <title>Fetch · The dog app that gets rescues adopted</title>
    <meta
      name="description"
      content="Fetch is a swipe feed for rating dogs, with adoptable rescue dogs mixed into the deck and a Lost & Found network for your neighborhood. In private beta now."
    />
    <meta property="og:title" content="Fetch · The dog app that gets rescues adopted" />
    <meta
      property="og:description"
      content="Fetch is a swipe feed for rating dogs, with adoptable rescue dogs mixed into the deck and a Lost & Found network for your neighborhood. In private beta now."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fetch" />
    <!-- VITE_SITE_URL is the absolute site origin (set in prod); empty in dev
         leaves a relative path, which most scrapers still resolve. -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <script>
      // Apply the user's theme before React paints to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('fetch.theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
