[project]
name = "fetch-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # <0.137: FastAPI >=0.138 registers included routers as lazy _IncludedRouter
    # entries, which prometheus-fastapi-instrumentator (<=7.1) can't traverse —
    # every request 500s. Lift the cap only after the instrumentator catches up.
    "fastapi>=0.110,<0.137",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    # Sync Postgres driver used ONLY by the Celery Beat scheduler
    # (app.beat_scheduler) — Beat is a synchronous process and can't use the
    # app's async asyncpg engine. The web app stays on asyncpg.
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "PyJWT[crypto]>=2.8,<3",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.6,<1",
    "Pillow>=10.2,<11",
    "slowapi>=0.1.9,<1",
    "httpx>=0.27,<1",
    "celery[redis]>=5.3,<6",
    "redis>=5.0,<6",
    "structlog>=24.1,<25",
    "sentry-sdk[fastapi]>=1.40,<3",
    "prometheus-fastapi-instrumentator>=7.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.2,<1",
    "black>=24,<25",
    "faker>=23,<30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Nothing here is a distributable package: `pip install` exists to pull in the
# dependencies, and `app` is imported from the working directory. Both
# Dockerfiles copy this file alone before installing, so they never noticed —
# but CI installs from a full checkout, where setuptools' auto-discovery sees
# `app/` and `alembic/` side by side, refuses to guess ("Multiple top-level
# packages discovered in a flat-layout") and fails the install. Saying "no
# packages" outright makes all three environments install the same thing.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Stated explicitly, not left to ruff's default. The default set grew from
# these four groups to several hundred rules between ruff 0.15 and 0.17, and
# CI installs ruff unpinned — so the lint job went red on rules nobody chose
# (484 of the 730 findings were B008 objecting to FastAPI's `Depends()`
# defaults), and backend-test and prod-images, which wait on it, stopped
# running. Widen this list on purpose, never by upgrading.
select = ["E4", "E7", "E9", "F"]
# E712 (== True/False) is the idiomatic way to build SQLAlchemy boolean filters
# (e.g. `.where(Model.is_active == True)`); ruff's "fix" would turn `== False`
# into Python `not`, which breaks the SQL expression. Ignore it project-wide.
ignore = ["E712"]
