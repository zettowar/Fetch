services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fetch
      POSTGRES_PASSWORD: fetch
      POSTGRES_DB: fetch
    # Loopback only. Docker publishes ports past the host firewall, so the
    # bare "5438:5432" put a Postgres with the password "fetch" on every
    # interface of whatever machine ran this file — including the production
    # droplet, where the dev stack has been started before. The server carried
    # a local edit deleting these lines; bound to 127.0.0.1 it doesn't need
    # one, and psql / a GUI on this machine still connect as before.
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fetch"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"  # loopback only, as for db above
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9001:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Read-only, and only so tests/test_beat_healthcheck.py can import the
      # probe's logic. Production bind-mounts the same file to /app.
      - ./deploy:/app/deploy:ro
      - uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/app:/app/app
      - uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    depends_on:
      # Beat now reads its schedule from the DB (DatabaseScheduler), so it needs
      # Postgres up, not just the broker.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3174:5173"
    volumes:
      - ./frontend/src:/app/src
      # Static assets too. Without this mount `public/` was whatever the image
      # was last built with, so an icon or email image added since then 404'd
      # in dev (Vite answered with index.html) until someone ran a rebuild.
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/vite.config.ts:/app/vite.config.ts
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads:
