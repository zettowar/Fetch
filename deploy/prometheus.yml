# Scrapes only the backend, which is the one thing in the stack that exposes
# app-level metrics. /metrics is not proxied by nginx, so it is reachable on the
# internal compose network and nowhere else.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fetchpawz-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Bulk email (digest, announcements, weekly recap) is sent from Celery, which
  # has no request path for the backend to observe. Without this target the
  # EmailDeliveryFailing rule can only ever see transactional mail.
  - job_name: fetchpawz-celery
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-worker:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
